# Signed iOS build of shield-app, uploaded to TestFlight.
# workflow_dispatch works once this file is on the default branch.
# Until then, label the pull request "testflight" (do not apply it from CI).
# The four secret names match Wood1974/tradedeck-shield.
name: Shield iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion. Leave empty to use the GitHub run number. Must be higher than the last TestFlight build of app.tradedeck.shield."
        required: false
        default: ""
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: write

jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'testflight'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPMENT_TEAM: 766456AWH4
      BUNDLE_ID: app.tradedeck.shield
      ASC_KEY_ID: 68FZ2ATL6W
      ASC_ISSUER: b00416ce-6169-4876-a31c-f3f4a30cc74c
      PROFILE_NAME: Shield App Store
    steps:
      - uses: actions/checkout@v4

      - name: Require signing credentials
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          missing=0
          for name in \
            IOS_DISTRIBUTION_CERTIFICATE_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 \
            APP_STORE_CONNECT_API_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repo secret: ${name}. Add it under Settings → Secrets and variables → Actions. These are the same four secrets as Wood1974/tradedeck-shield."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: shield-app/package-lock.json

      - name: Install dependencies
        working-directory: shield-app
        run: npm ci

      - name: Web build
        working-directory: shield-app
        run: npm run build

      - name: Sync iOS
        working-directory: shield-app
        run: npx cap sync ios

      - name: Install pods
        working-directory: shield-app/ios/App
        run: pod install

      - name: Confirm App Store bundle id
        working-directory: shield-app/ios/App
        run: |
          if grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.tradedeck.shield;' App.xcodeproj/project.pbxproj; then
            echo "::error::iOS target is com.tradedeck.shield. App Store Connect app Tradedeck-shield (Apple ID 6819876039) uses ${BUNDLE_ID}."
            exit 1
          fi
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" App.xcodeproj/project.pbxproj

      - name: Install Apple distribution certificate
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/shield-signing.keychain-db"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "shield-ci" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "shield-ci" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "shield-ci" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*Distribution.*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::The temporary keychain has no Distribution identity. Check IOS_DISTRIBUTION_CERTIFICATE_BASE64 and IOS_DISTRIBUTION_CERTIFICATE_PASSWORD."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "Using signing identity: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profile
        env:
          PROFILE: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          case "$APP_ID" in
            *."$BUNDLE_ID") ;;
            *)
              echo "::error::Provisioning profile '${NAME}' is for ${APP_ID}, which is not ${BUNDLE_ID}. IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 must be the App Store profile for ${BUNDLE_ID}."
              exit 1
              ;;
          esac
          if [ "$NAME" != "$PROFILE_NAME" ]; then
            echo "::error::Provisioning profile name is '${NAME}', expected '${PROFILE_NAME}' (App Store, Apple Distribution, ${BUNDLE_ID})."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile ${PROFILE_NAME} (${UUID}) for ${APP_ID}"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Set build number
        working-directory: shield-app/ios/App
        run: |
          # A testflight label has no workflow input, so the build number is the run number.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD="${{ github.event.inputs.build_number }}"
          else
            BUILD="${{ github.run_number }}"
          fi
          if [ -z "$BUILD" ]; then
            BUILD="${{ github.run_number }}"
          fi
          if ! [[ "$BUILD" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Build number must be integers separated by dots, got: ${BUILD}"
            exit 1
          fi
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${BUILD};/" App.xcodeproj/project.pbxproj
          echo "CFBundleVersion=${BUILD} (marketing version stays MARKETING_VERSION in the Xcode project)"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"

      - name: Sign only the App target
        working-directory: shield-app
        run: |
          # Command-line CODE_SIGN_STYLE and PROVISIONING_PROFILE_SPECIFIER apply to
          # every target, including CocoaPods frameworks, and export then fails.
          python3 ios/scripts/apply-app-store-signing.py \
            ios/App/App.xcodeproj/project.pbxproj \
            --profile-name "$PROFILE_NAME" \
            --profile-uuid "$PROFILE_UUID" \
            --identity "$SIGNING_IDENTITY"

      - name: Archive with manual signing
        working-directory: shield-app/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TradeDeckShield.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Export IPA
        run: |
          EXPORT="$RUNNER_TEMP/export"
          export PLIST_PATH="$RUNNER_TEMP/ExportOptions.plist"
          # The distribution identity contains a colon, which PlistBuddy treats as a key path.
          python3 - <<'PY'
          import os, plistlib
          plist = {
              "method": "app-store-connect",
              "teamID": os.environ["DEVELOPMENT_TEAM"],
              "signingStyle": "manual",
              "signingCertificate": os.environ["SIGNING_IDENTITY"],
              "uploadSymbols": True,
              "provisioningProfiles": {
                  os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"],
              },
          }
          with open(os.environ["PLIST_PATH"], "wb") as fh:
              plistlib.dump(plist, fh)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TradeDeckShield.xcarchive" \
            -exportPath "$EXPORT" \
            -exportOptionsPlist "$PLIST_PATH"
          IPA=$(find "$EXPORT" -name '*.ipa' -print -quit)
          if [ -z "$IPA" ]; then
            echo "::error::Export produced no IPA."
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "Exported $IPA"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: shield-app-ios-testflight
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: b00416ce-6169-4876-a31c-f3f4a30cc74c
          api-key-id: 68FZ2ATL6W
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
