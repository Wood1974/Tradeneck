# Shield mobile app CI: build and test TypeScript/Vite project
# Runs npm build and npm test for shield-app (Capacitor 6 + Vite + TypeScript)

name: Shield App Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies (shield-app)
        run: cd shield-app && npm install

      - name: TypeScript check and build (shield-app)
        run: cd shield-app && npm run build

      - name: Run tests (shield-app)
        run: cd shield-app && npm test
