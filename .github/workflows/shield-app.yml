name: Shield App

on:
  push:
    branches: ["main", "claude/claude-code-godmode-setup-kw0trw"]
    paths: ["shield-app/**", ".github/workflows/shield-app.yml"]
  pull_request:
    branches: ["main", "claude/claude-code-godmode-setup-kw0trw"]
    paths: ["shield-app/**", ".github/workflows/shield-app.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: shield-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: shield-app/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Production bundle must not contain e2e-only code
        run: npm run check:bundle
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: shield-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: shield-app/playwright-report/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: shield-app/package-lock.json
      - name: Android SDK 36
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -n "$SM" -a -x "$SM"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Web assets for the native shell
        run: npm run build
      - name: Register the secure-capture plugin
        run: npx cap sync android
      - name: Plugin unit tests and debug APK
        working-directory: shield-app/android
        run: chmod +x gradlew && ./gradlew :tradedeck-secure-capture:testDebugUnitTest :app:assembleDebug --stacktrace

  ios-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: shield-app/package-lock.json
      - run: npm ci
      - name: Web assets for the native shell
        run: npm run build
      - name: Register the secure-capture plugin
        run: npx cap sync ios
      - name: Install pods
        working-directory: shield-app/ios/App
        run: pod install
      - name: Unsigned iOS compile
        working-directory: shield-app/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
