name: Shield App

on:
  push:
    branches: ["main"]
    paths: ["shield-app/**", ".github/workflows/shield-app.yml"]
  pull_request:
    branches: ["main"]
    paths: ["shield-app/**", ".github/workflows/shield-app.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: shield-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: shield-app/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Production bundle must not contain e2e-only code
        run: npm run check:bundle
      - name: Unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: shield-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: shield-app/playwright-report/
          retention-days: 7
