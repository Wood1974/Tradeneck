<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TradeDeck</title>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#0A0A0A"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TradeDeck"/>
<meta name="mobile-web-app-capable" content="yes"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0A;--surface:#141414;--border:#222;
  --teal:#0BBCD4;--text:#F0F0F0;--muted:#888;--danger:#e05555;--green:#4ADE80;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:100}
nav button{flex:1;padding:12px 4px 10px;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
nav button.active{color:var(--teal)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
#app{padding:16px 16px 80px}
.screen{display:none}.screen.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:6px}
.card p{font-size:13px;color:var(--muted);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--teal);color:#000}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-block{width:100%;margin-top:8px}
input,textarea,select{width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{min-height:80px;resize:vertical}
label{font-size:13px;color:var(--muted);margin-bottom:4px;display:block}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tab-btn{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:13px;cursor:pointer}
.tab-btn.active{background:var(--teal);color:#000;border-color:var(--teal)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-teal{background:rgba(11,188,212,.15);color:var(--teal)}
.badge-ksl{background:rgba(255,180,0,.15);color:#ffb400}
.screen-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.screen-header h2{font-size:20px;font-weight:700}
#auth-wrap{max-width:400px;margin:60px auto;padding:0 16px}
#auth-wrap h1{font-size:26px;font-weight:800;margin-bottom:6px}
#auth-wrap p.sub{color:var(--muted);margin-bottom:24px}
.auth-toggle{font-size:13px;color:var(--muted);margin-top:12px;text-align:center;cursor:pointer}
.auth-toggle span{color:var(--teal)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.overlay.open{display:flex}
.overlay-inner{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-height:90vh;overflow-y:auto}
.overlay-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.overlay-header h3{font-size:17px;font-weight:700}
.close-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.flex{display:flex}.between{justify-content:space-between}.gap8{gap:8px}.mt8{margin-top:8px}.mt16{margin-top:16px}
.text-muted{color:var(--muted);font-size:13px}
.draw-status{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase}
.draw-status.pending{background:rgba(255,180,0,.15);color:#ffb400}
.draw-status.submitted{background:rgba(11,188,212,.15);color:var(--teal)}
.draw-status.approved{background:rgba(74,222,128,.15);color:var(--green)}
.draw-status.disputed{background:rgba(224,85,85,.15);color:var(--danger)}
.escrow-bar{background:var(--border);border-radius:4px;height:8px;margin:8px 0}
.escrow-fill{background:var(--teal);height:100%;border-radius:4px;transition:width .4s}
.stars{display:flex;gap:6px;font-size:28px;cursor:pointer;margin:10px 0}
.stars span{color:var(--border);transition:color .1s}
.stars span.on{color:#ffb400}
.milestone-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.milestone-row input{margin-bottom:0}
.milestone-row .pct-input{width:65px;flex-shrink:0;text-align:center}
.county-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.county-tab{white-space:nowrap;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;cursor:pointer;flex-shrink:0}
.county-tab.active{background:var(--teal);color:#000;border-color:var(--teal)}
.trade-tab{white-space:nowrap;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;cursor:pointer;flex-shrink:0}
.trade-tab.active{background:var(--teal);color:#000;border-color:var(--teal)}
.applicant-count{font-size:12px;color:var(--muted)}
.lead-category{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:20px 0 8px;padding-top:4px}
.lead-category:first-child{margin-top:0}
.lead-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.lead-tag-free{background:rgba(74,222,128,.15);color:var(--green)}
.lead-tag-paid{background:rgba(255,180,0,.15);color:#ffb400}
.lead-link{color:var(--teal);font-size:12px;font-weight:600;text-decoration:none;display:inline-block;margin-top:8px}
.adm-subtabs{display:flex;gap:8px;margin-bottom:16px}
.adm-subtab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:13px;cursor:pointer}
.adm-subtab.active{background:var(--teal);color:#000;border-color:var(--teal)}
.adm-subview{display:none}.adm-subview.active{display:block}
.adm-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.adm-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase;flex-shrink:0}
.adm-badge-admin{background:rgba(11,188,212,.15);color:var(--teal)}
.adm-badge-user{background:var(--border);color:var(--muted)}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-wrap">
  <h1>TradeDeck</h1>
  <p class="sub">The marketplace built for the trades.</p>
  <label>Email</label>
  <input id="auth-email" type="email" placeholder="you@example.com"/>
  <label>Password</label>
  <input id="auth-password" type="password" placeholder="••••••••"/>
  <button class="btn btn-primary btn-block" onclick="authSubmit()">Sign In</button>
  <p id="auth-error" style="color:var(--danger);font-size:13px;margin-top:8px"></p>
  <p class="auth-toggle">No account? <span onclick="toggleAuth()">Sign up</span></p>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="screen-header"><h2>Home</h2>
      <div class="flex gap8" style="align-items:center">
        <span id="home-tier" class="badge badge-teal"></span>
        <button class="btn btn-outline btn-sm" onclick="signOut()">Sign out</button>
      </div>
    </div>
    <div id="home-stats" class="card"></div>
    <div class="card">
      <h3>Quick Actions</h3>
      <div class="flex gap8 mt8">
        <button class="btn btn-primary btn-sm" onclick="switchTab('post')">Post a Job</button>
        <button class="btn btn-outline btn-sm" onclick="switchTab('work')">Find Work</button>
      </div>
    </div>
  </div>

  <!-- FIND WORK -->
  <div id="screen-work" class="screen">
    <div class="screen-header"><h2>Find Work</h2></div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="workTab('open',this)">Open Jobs</button>
      <button class="tab-btn" onclick="workTab('ksl',this)">KSL Jobs</button>
      <button class="tab-btn" onclick="workTab('leads',this)">Lead Sources</button>
    </div>
    <div class="county-tabs" id="county-tabs" style="display:none"></div>
    <div class="county-tabs" id="trade-tabs" style="display:none"></div>
    <div id="work-content"></div>
  </div>

  <!-- POST A JOB -->
  <div id="screen-post" class="screen">
    <div class="screen-header"><h2>Post a Job</h2></div>
    <div class="card">
      <label>Job Title</label>
      <input id="post-title" placeholder="e.g. Framing crew needed — custom home"/>
      <label>Trade</label>
      <select id="post-trade">
        <option>Framing</option><option>Concrete</option><option>Roofing</option>
        <option>Electrical</option><option>Plumbing</option><option>HVAC</option>
        <option>Drywall</option><option>Flooring</option><option>Excavation</option>
        <option>Landscaping</option><option>General Labor</option><option>Other</option>
      </select>
      <label>Location / City</label>
      <input id="post-city" placeholder="e.g. Francis"/>
      <label>County</label>
      <select id="post-county">
        <option>Summit</option><option>Wasatch</option><option>Utah</option>
        <option>Salt Lake</option><option>Davis</option><option>Weber</option>
        <option>Cache</option><option>Tooele</option><option>Juab</option>
        <option>Sanpete</option><option>Sevier</option><option>Millard</option>
        <option>Iron</option><option>Washington</option><option>Kane</option>
        <option>Garfield</option><option>Piute</option><option>Wayne</option>
        <option>Emery</option><option>Carbon</option><option>Grand</option>
        <option>San Juan</option><option>Uintah</option><option>Duchesne</option>
        <option>Daggett</option><option>Morgan</option><option>Rich</option>
        <option>Box Elder</option><option>Other</option>
      </select>
      <label>Description</label>
      <textarea id="post-desc" placeholder="Scope, timeline, crew size…"></textarea>
      <label>Budget / Rate</label>
      <input id="post-budget" placeholder="e.g. $85,000 or $45/hr"/>
      <hr style="border:none;border-top:1px solid var(--border);margin:16px 0"/>
      <h3 style="margin-bottom:10px">Draw Schedule <span class="text-muted">(optional)</span></h3>
      <div id="milestone-rows"></div>
      <div class="flex gap8 mt8">
        <button class="btn btn-outline btn-sm" onclick="addMilestone()">+ Milestone</button>
        <span id="pct-total" class="text-muted" style="align-self:center;font-size:13px"></span>
      </div>
      <button class="btn btn-primary btn-block mt16" onclick="submitJob()">Post Job</button>
    </div>
  </div>

  <!-- DRAW MANAGER -->
  <div id="screen-draws" class="screen">
    <div class="screen-header"><h2>Draw Manager</h2></div>
    <div id="draws-content"></div>
  </div>

  <!-- SHIELD -->
  <div id="screen-shield" class="screen">
    <div class="screen-header"><h2>TradeDeck Shield</h2></div>
    <div id="shield-dashboard-mount"></div>
  </div>

  <!-- PROFILE -->
  <div id="screen-profile" class="screen">
    <div class="screen-header"><h2>Profile</h2></div>
    <div id="profile-content"></div>
  </div>

  <!-- ADMIN -->
  <div id="screen-admin" class="screen">
    <div class="screen-header"><h2>Admin</h2></div>
    <div class="adm-subtabs">
      <button class="adm-subtab active" onclick="admTab('users',this)">Users</button>
      <button class="adm-subtab" onclick="admTab('jobs',this)">Jobs</button>
    </div>
    <div class="adm-subview active" id="adm-users"></div>
    <div class="adm-subview" id="adm-jobs"></div>
  </div>

</div>

<!-- NAV -->
<nav id="main-nav" style="display:none">
  <button class="active" onclick="switchTab('home')" id="nav-home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home
  </button>
  <button onclick="switchTab('work')" id="nav-work">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>Find Work
  </button>
  <button onclick="switchTab('post')" id="nav-post">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Post Job
  </button>
  <button onclick="switchTab('draws')" id="nav-draws">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Draws
  </button>
  <button onclick="switchTab('shield')" id="nav-shield">
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>Shield
  </button>
  <button onclick="switchTab('profile')" id="nav-profile">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile
  </button>
  <button onclick="switchTab('admin')" id="nav-admin" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Admin
  </button>
</nav>

<!-- RATING OVERLAY -->
<div class="overlay" id="rating-overlay">
  <div class="overlay-inner">
    <div class="overlay-header">
      <h3>Rate this Job</h3>
      <button class="close-btn" onclick="closeOverlay('rating-overlay')">×</button>
    </div>
    <div class="stars" id="star-picker">
      <span onclick="setRating(1)">★</span><span onclick="setRating(2)">★</span>
      <span onclick="setRating(3)">★</span><span onclick="setRating(4)">★</span>
      <span onclick="setRating(5)">★</span>
    </div>
    <textarea id="review-text" placeholder="Share your experience (optional)…"></textarea>
    <button class="btn btn-primary btn-block" onclick="submitRating()">Submit Rating</button>
  </div>
</div>

<div class="overlay" id="applicants-overlay">
  <div class="overlay-inner">
    <div class="overlay-header">
      <h3 id="applicants-title">Applicants</h3>
      <button class="close-btn" onclick="closeOverlay('applicants-overlay')">×</button>
    </div>
    <div id="applicants-content"></div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SUPABASE_URL     = 'https://jlaajejpqjldpbinktln.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsYWFqZWpwcWpsZHBiaW5rdGxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDg3MTksImV4cCI6MjEwMTc4NDcxOX0.tP-seLGoJnivrYmNhhTDmDJw4Uk92D95-zrwWB1G_S4';
// Guard the single CDN dependency: if @supabase/supabase-js failed to load
// (ad blocker, CSP, CDN outage), sb is null and the auth page shows a clear
// message instead of dead buttons or a blank screen.
const { createClient } = (typeof supabase !== 'undefined' && supabase) ? supabase : {};
const sb = createClient ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
window.sb = sb; // shield.js (external script) reads the shared Supabase client
const SB_LOAD_ERROR = 'Could not load the sign-in service. Check your connection or any ad blocker, then reload.';

// ─── STATE ────────────────────────────────────────────────────────────────────
let STATE = {
  user:null, profile:null, isAdmin:false,
  jobs:[], kslJobs:[], draws:[],
  appliedJobIds:{}, applicantCounts:{}, payeeProfiles:{}, shieldLoaded:false,
  activeWorkTab:'open', activeCounty:'all', activeTrade:'all', activeAdmTab:'users', admLoaded:false,
  currentRatingJobId:null, currentRatingRevieweeId:null, currentRating:0,
  milestones:[]
};

// ─── AUTH ─────────────────────────────────────────────────────────────────────
let authMode = 'signin';
function toggleAuth() {
  authMode = authMode==='signin'?'signup':'signin';
  document.querySelector('#auth-wrap button').textContent = authMode==='signin'?'Sign In':'Create Account';
  document.querySelector('.auth-toggle span').textContent = authMode==='signin'?'Sign up':'Sign in';
}
async function authSubmit() {
  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl    = document.getElementById('auth-error');
  errEl.style.color = 'var(--danger)';
  errEl.textContent = '';
  if (!sb){errEl.textContent=SB_LOAD_ERROR;return;}
  if (!email||!password){errEl.textContent='Email and password required';return;}
  const res = authMode==='signup'
    ? await sb.auth.signUp({email,password})
    : await sb.auth.signInWithPassword({email,password});
  if (res.error){errEl.textContent=res.error.message;return;}
  if (authMode==='signup'&&!res.error){errEl.style.color='var(--green)';errEl.textContent='Check your email to confirm.';return;}
  await onLogin(res.data.user);
}
async function onLogin(user) {
  STATE.user = user;
  let {data:profile} = await sb.from('profiles').select('*').eq('id',user.id).single();
  if (!profile) {
    await sb.from('profiles').insert({id:user.id,email:user.email});
    profile = {id:user.id,email:user.email,tier:1};
  }
  STATE.profile = profile;
  /* Admin check is cosmetic only -- it shows/hides the tab. Real
     enforcement is the "Admins have full access" RLS policies from
     admin-setup.sql; nothing here grants any actual permission. This
     also tolerates profiles.is_admin not existing yet on the live
     database (admin-setup.sql not run) -- profile.is_admin is just
     undefined/falsy in that case, so the tab simply stays hidden. */
  STATE.isAdmin = !!profile.is_admin;
  if (STATE.isAdmin) document.getElementById('nav-admin').style.display = '';
  document.getElementById('auth-wrap').style.display = 'none';
  document.getElementById('app').style.display       = 'block';
  document.getElementById('main-nav').style.display  = 'flex';
  try { await loadData(); } catch (e) { /* render with whatever loaded */ }
  render();
}
async function signOut(){ try { if (sb) await sb.auth.signOut(); } finally { location.reload(); } }

// ─── LOAD DATA ────────────────────────────────────────────────────────────────
async function loadData() {
  const [jobsRes, drawRes, kslRes] = await Promise.all([
    sb.from('jobs').select('*').eq('status','open').eq('source','tradedeck').order('created_at',{ascending:false}).limit(50),
    sb.from('draw_schedules').select('*, draws(*)').order('created_at',{ascending:false}).limit(30),
    sb.from('jobs').select('*').eq('source','ksl').order('created_at',{ascending:false}).limit(200),
  ]);
  STATE.jobs    = jobsRes.data  || [];
  STATE.draws   = drawRes.data  || [];
  STATE.kslJobs = kslRes.data   || [];

  /* Resolve the hired contractor (payee) for any draw schedule that has one,
     so the Draw Manager can name who each schedule pays. profiles are
     world-readable (profiles_select policy). */
  STATE.payeeProfiles = {};
  const payeeIds = [...new Set(STATE.draws.map(s=>s.payee_id).filter(Boolean))];
  if (payeeIds.length){
    const {data:payees} = await sb.from('profiles').select('id,full_name,email').in('id',payeeIds);
    (payees||[]).forEach(p=>{STATE.payeeProfiles[p.id]=p;});
  }

  /* Applied state (mine only -- RLS on applications only lets a user
     see their own rows or rows on a job they posted, so this can't leak
     anyone else's applications) + privacy-safe applicant counts via the
     job_application_counts() RPC, which returns totals only, never who
     applied. */
  const jobIds = STATE.jobs.map(j=>j.id);
  STATE.appliedJobIds = {};
  STATE.applicantCounts = {};
  if (jobIds.length && STATE.user) {
    const [mineRes, countsRes] = await Promise.all([
      sb.from('applications').select('job_id').eq('applicant_id',STATE.user.id).in('job_id',jobIds),
      sb.rpc('job_application_counts',{p_job_ids:jobIds}),
    ]);
    (mineRes.data||[]).forEach(a=>{STATE.appliedJobIds[a.job_id]=true;});
    (countsRes.data||[]).forEach(row=>{STATE.applicantCounts[row.job_id]=row.applicant_count;});
  }
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  if (tab==='admin') loadAdmin();
  if (tab==='shield') loadShield();
}
// Shield UI lives in shield.js (loaded after this script). Mount the homeowner
// dashboard once on first open; the module reads the global `sb` client.
function loadShield(){
  const mount = document.getElementById('shield-dashboard-mount');
  if (!mount || STATE.shieldLoaded) return;
  if (typeof window.renderShieldDashboard !== 'function'){
    mount.innerHTML = '<p class="text-muted" style="padding:20px 0">Shield module failed to load.</p>';
    return;
  }
  STATE.shieldLoaded = true;
  window.renderShieldDashboard(mount);
}
function workTab(tab,btn) {
  STATE.activeWorkTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('county-tabs').style.display = tab==='ksl'?'flex':'none';
  document.getElementById('trade-tabs').style.display  = tab==='ksl'?'flex':'none';
  renderWork();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){renderHome();renderWork();renderDraws();renderProfile();}

// Construction trade categories present on scraped KSL listings (jobs.trade).
// Most KSL rows are NOT trade-tagged -- the KSL scraper pulls the general job
// board, not a construction-only feed, so untagged rows are mostly unrelated
// listings (retail, medical, sales, etc.), not miscategorized trade jobs.
// Default view ('All Trades') therefore excludes 'Other' so a county isn't a
// long scroll of non-construction jobs; 'Other' stays one tap away rather
// than being hidden outright, in keeping with full transparency.
const TRADE_CATEGORIES = ['All Trades','General Labor','Electrical','Excavation','Concrete','HVAC',
  'Framing','Plumbing','Flooring','Landscaping','Roofing','Drywall','Other'];
const KNOWN_TRADES = new Set(TRADE_CATEGORIES.filter(t=>t!=='All Trades'&&t!=='Other'));
function jobMatchesTrade(job, trade){
  if (trade==='all') return KNOWN_TRADES.has(job.trade); // "All Trades" = every known category, NOT Other
  if (trade==='Other') return !job.trade || !KNOWN_TRADES.has(job.trade);
  return job.trade===trade;
}

function renderWork() {
  const el = document.getElementById('work-content');
  const countyEl = document.getElementById('county-tabs');
  const tradeEl = document.getElementById('trade-tabs');
  if (STATE.activeWorkTab==='ksl') {
    countyEl.style.display = 'flex';
    countyEl.innerHTML = COUNTIES.map(c=>`
      <button class="county-tab${(c==='All'&&STATE.activeCounty==='all')||(c===STATE.activeCounty)?' active':''}"
        onclick="filterCounty('${c==='All'?'all':c}',this)">${c}</button>`).join('');
    const byCounty = STATE.activeCounty==='all'?STATE.kslJobs:STATE.kslJobs.filter(j=>j.county===STATE.activeCounty);
    tradeEl.style.display = 'flex';
    tradeEl.innerHTML = TRADE_CATEGORIES.map(t=>{
      const val = t==='All Trades'?'all':t;
      const count = byCounty.filter(j=>jobMatchesTrade(j,val)).length;
      return `<button class="trade-tab${val===STATE.activeTrade?' active':''}"
        onclick="filterTrade('${val}',this)">${t} (${count})</button>`;
    }).join('');
    const jobs = byCounty.filter(j=>jobMatchesTrade(j,STATE.activeTrade));
    el.innerHTML = jobs.length ? jobs.map(j=>`
      <div class="card">
        <div class="flex between"><h3>${j.title}</h3><span class="badge badge-ksl">${j.trade||'KSL'}</span></div>
        <p>${j.company||''} · ${j.location||''}, ${j.county||''}</p>
        <p style="margin-top:6px">${(j.description||'').slice(0,120)}…</p>
        <p class="text-muted" style="margin-top:4px;font-size:12px">${j.rate||''}</p>
      </div>`).join('') : '<p class="text-muted" style="padding:20px 0">No KSL jobs in this category yet.</p>';
  } else if (STATE.activeWorkTab==='leads') {
    countyEl.style.display = 'none';
    tradeEl.style.display = 'none';
    el.innerHTML = LEAD_CATEGORIES.map(group=>`
      <div class="lead-category">${group.cat}</div>
      ${group.items.map(l=>`
        <div class="card">
          <div class="flex between"><h3>${l.name}</h3><span class="lead-tag lead-tag-${l.cost}">${l.cost}</span></div>

          <a class="lead-link" href="${l.link}" target="_blank" rel="noopener">${l.linkLabel} →</a>
        </div>`).join('')}`).join('');
  } else {
    countyEl.style.display = 'none';
    tradeEl.style.display = 'none';
    el.innerHTML = STATE.jobs.length ? STATE.jobs.map(j=>{
      const isOwn = !!(j.owner_id && STATE.user && j.owner_id === STATE.user.id);
      const canRate = !!(j.owner_id && STATE.user && j.owner_id !== STATE.user.id);
      const applied = !!STATE.appliedJobIds[j.id];
      const count = STATE.applicantCounts[j.id]||0;
      return `
      <div class="card">
        <div class="flex between"><h3>${j.title}</h3><span class="badge badge-teal">${j.trade||'Trade'}</span></div>
        <p>${j.location||''}, ${j.county||''}</p>

function filterCounty(county,btn){
  STATE.activeCounty=county;
  renderWork(); // rebuilds both tab rows (trade counts depend on county)
}
function filterTrade(trade,btn){
  STATE.activeTrade=trade;
  renderWork();
}

// ─── APPLY ────────────────────────────────────────────────────────────────────
async function applyToJob(jobId,btn){
  if (!STATE.user){alert('Please sign in again to apply.');return;}
  if (STATE.appliedJobIds[jobId]) return;
  btn.disabled = true;
  const existing = await sb.from('applications').select('id').eq('job_id',jobId).eq('applicant_id',STATE.user.id).maybeSingle();
  if (existing.data) {
    STATE.appliedJobIds[jobId] = true;
    btn.textContent = 'Applied'; btn.classList.remove('btn-primary'); btn.classList.add('btn-outline');
    return;
  }
  const {error} = await sb.from('applications').insert({job_id:jobId,applicant_id:STATE.user.id});
  if (error){alert('Could not submit your application. '+error.message);btn.disabled=false;return;}
  STATE.appliedJobIds[jobId] = true;
  STATE.applicantCounts[jobId] = (STATE.applicantCounts[jobId]||0)+1;
  btn.textContent = 'Applied'; btn.classList.remove('btn-primary'); btn.classList.add('btn-outline');
}

// ─── MANAGE APPLICANTS (job owner) ──────────────────────────────────────────────
// RLS lets a job poster SELECT applications on their own jobs; profiles are
// world-readable. Accepting one calls the accept_application() RPC, which
// atomically marks it accepted, rejects the rest, and sets the contractor as
// payee on the job's draw schedule(s) and every draw under them.
let currentApplicantsJobId = null;
async function openApplicants(jobId){
  currentApplicantsJobId = jobId;
  document.getElementById('applicants-content').innerHTML =
    '<p class="text-muted" style="padding:20px 0">Loading…</p>';
  document.getElementById('applicants-overlay').classList.add('open');
  const {data:apps,error} = await sb.from('applications')
    .select('id,applicant_id,status,bid_amount,message,created_at')
    .eq('job_id',jobId)
    .order('created_at',{ascending:true});
  if (error){
    document.getElementById('applicants-content').innerHTML =
      `<p class="text-muted" style="padding:20px 0">Could not load applicants. ${error.message}</p>`;
    return;
  }
  const ids = [...new Set((apps||[]).map(a=>a.applicant_id).filter(Boolean))];
  const profiles = {};
  if (ids.length){
    const {data:profs} = await sb.from('profiles')
      .select('id,full_name,email,trade,tier,jobs_completed,rating').in('id',ids);
    (profs||[]).forEach(p=>{profiles[p.id]=p;});
  }
  renderApplicants(apps||[],profiles);
}
function renderApplicants(apps,profiles){
  const el = document.getElementById('applicants-content');
  document.getElementById('applicants-title').textContent =
    `Applicants (${apps.length})`;
  if (!apps.length){
    el.innerHTML='<p class="text-muted" style="padding:20px 0">No applicants yet.</p>';
    return;
  }
  const tiers=['','Verified','Active','Proven','Trusted','TradeDeck Pro'];
  const someoneHired = apps.some(a=>a.status==='accepted');
  el.innerHTML = apps.map(a=>{
    const p = profiles[a.applicant_id]||{};
    const name = p.full_name||p.email||'Applicant';
    const accepted = a.status==='accepted';
    const rejected = a.status==='rejected';
    return `
    <div class="card" style="${rejected?'opacity:.55':''}">
      <div class="flex between"><h3>${name}</h3>
        ${accepted?'<span class="badge badge-teal">Hired</span>'
          :rejected?'<span class="text-muted" style="font-size:12px">Not selected</span>':''}
      </div>
      <p class="text-muted" style="font-size:12px;margin-top:2px">${p.trade||'No trade set'} · Tier: ${tiers[p.tier||1]||'Verified'} · ${p.jobs_completed||0} jobs done</p>
      ${a.bid_amount!=null?`<p style="margin-top:6px">Bid: $${Number(a.bid_amount).toLocaleString()}</p>`:''}
      ${a.message?`<p style="margin-top:6px;font-size:13px">${a.message}</p>`:''}
      ${accepted
        ? '<p class="text-muted" style="font-size:12px;margin-top:8px">Attached as payee on this job’s draws.</p>'
        : rejected ? ''
        : `<button class="btn btn-primary btn-sm mt8" onclick="acceptApplicant('${a.id}',this)">${someoneHired?'Hire instead':'Hire'}</button>`}
    </div>`;
  }).join('');
}
async function acceptApplicant(applicationId,btn){
  if (!confirm('Hire this applicant? They will be set as the payee on this job’s draw schedule, and any other applicants will be declined.')) return;
  btn.disabled = true; btn.textContent = 'Hiring…';
  const {error} = await sb.rpc('accept_application',{p_application_id:applicationId});
  if (error){
    alert('Could not hire this applicant. '+error.message);
    btn.disabled = false; btn.textContent = 'Hire';
    return;
  }
  if (currentApplicantsJobId) await openApplicants(currentApplicantsJobId);
  await loadData(); renderDraws();
}

// ─── POST JOB ─────────────────────────────────────────────────────────────────
let milestones = [];
function addMilestone(){milestones.push({name:'',pct:0,verifier:'owner'});renderMilestones();}
function removeMilestone(i){milestones.splice(i,1);renderMilestones();}
function renderMilestones(){
  const el = document.getElementById('milestone-rows');
  el.innerHTML = milestones.map((m,i)=>`
    <div class="milestone-row">
      <input placeholder="Name" value="${m.name}" oninput="milestones[${i}].name=this.value"/>
      <input class="pct-input" type="number" placeholder="%" value="${m.pct||''}" min="1" max="100"
        oninput="milestones[${i}].pct=+this.value;updatePct()"/>
      <select style="width:100px;margin-bottom:0" onchange="milestones[${i}].verifier=this.value">
        <option value="owner" ${m.verifier==='owner'?'selected':''}>Owner</option>
        <option value="inspector" ${m.verifier==='inspector'?'selected':''}>Inspector</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="removeMilestone(${i})">✕</button>
    </div>`).join('');
  updatePct();
}
function updatePct(){
  const total = milestones.reduce((s,m)=>s+(+m.pct||0),0);
  const el = document.getElementById('pct-total');
  el.textContent = milestones.length?`${total}% of 100%`:'';
  el.style.color = total===100?'var(--green)':total>100?'var(--danger)':'var(--muted)';
}
async function submitJob(){
  const title = document.getElementById('post-title').value.trim();
  if (!title){alert('Title required');return;}
  const total = milestones.reduce((s,m)=>s+(+m.pct||0),0);
  if (milestones.length&&total!==100){alert('Draw percentages must total 100%');return;}
  const {data:job,error} = await sb.from('jobs').insert({
    title,
    trade:    document.getElementById('post-trade').value,
    location: document.getElementById('post-city').value,
    county:   document.getElementById('post-county').value,
    state:    'UT',
    description: document.getElementById('post-desc').value,
    rate:     document.getElementById('post-budget').value,
    owner_id: STATE.user.id,
    source:   'tradedeck',
    status:   'open'
  }).select().single();
  if (error){alert('Error: '+error.message);return;}
  if (milestones.length) {
    const budget = parseInt(document.getElementById('post-budget').value.replace(/\D/g,''))||0;
    const {data:sched} = await sb.from('draw_schedules').insert({
      job_id:         job.id,
      owner_id:       STATE.user.id,
      contract_value: budget||1
    }).select().single();
    if (sched) {
      // NOTE: draws.job_id is misleadingly named -- its FK actually points
      // at draw_schedules.id, not jobs.id (confirmed via the live FK
      // constraint "draws_schedule_id_fkey"). sched.id is correct here.
      await sb.from('draws').insert(milestones.map((m,i)=>({
        job_id:          sched.id,
        milestone_order: i+1,
        milestone_name:  m.name,
        percentage:      m.pct,
        amount_cents:    Math.round((budget||1)*100*(m.pct/100)),
        verifier_type:   m.verifier,
        status:          'pending'
      })));
    }
  }
  milestones=[];renderMilestones();
  ['post-title','post-city','post-desc','post-budget'].forEach(id=>document.getElementById(id).value='');
  await loadData();render();
  switchTab('work');
}

// ─── DRAW MANAGER ─────────────────────────────────────────────────────────────
function renderDraws(){
  const el = document.getElementById('draws-content');
  if (!STATE.draws.length){
    el.innerHTML='<p class="text-muted" style="padding:20px 0">No draw schedules yet. Add milestones when posting a job.</p>';
    return;
  }
  el.innerHTML = STATE.draws.map(s=>{
    const draws = (s.draws||[]).slice().sort((a,b)=>a.milestone_order-b.milestone_order);
    const releasedPct = draws.filter(d=>d.status==='approved'||d.status==='released').reduce((sum,d)=>sum+(d.percentage||0),0);
    const payee = s.payee_id ? STATE.payeeProfiles[s.payee_id] : null;
    const payeeLabel = payee ? (payee.full_name||payee.email) : null;
    return `<div class="card">
      <div class="flex between"><h3>Draw Schedule</h3><span class="text-muted">$${(s.contract_value||0).toLocaleString()}</span></div>
      <p class="text-muted" style="font-size:12px;margin-top:2px">${payeeLabel?`Contractor: ${payeeLabel}`:'No contractor hired yet'}</p>
      <div class="escrow-bar"><div class="escrow-fill" style="width:${releasedPct}%"></div></div>
      <p class="text-muted" style="font-size:12px;margin-bottom:12px">${releasedPct}% released</p>
      ${draws.map(d=>`
        <div class="flex between mt8" style="align-items:center">
          <span style="font-size:14px">${d.milestone_order}. ${d.milestone_name} <span class="text-muted">(${d.percentage}%)</span></span>
          <div class="flex gap8" style="align-items:center">
            <span class="draw-status ${d.status}">${d.status}</span>
            ${d.status==='pending'?`<button class="btn btn-outline btn-sm" onclick="drawAction('${d.id}','submitted')">Submit</button>`:''}
            ${d.status==='submitted'?`
              <button class="btn btn-primary btn-sm" onclick="drawAction('${d.id}','approved')">Approve</button>
              <button class="btn btn-danger btn-sm" onclick="drawAction('${d.id}','disputed')">Dispute</button>`:''}
          </div>
        </div>`).join('')}
    </div>`;
  }).join('');
}
async function drawAction(id,status){
  await sb.from('draws').update({status,resolved_at:['approved','disputed'].includes(status)?new Date().toISOString():null}).eq('id',id);
  await loadData();renderDraws();
}

      <input id="edit-name" value="${p.full_name||''}"/>
      <label>Company</label>
      <input id="edit-company" value="${p.company||''}"/>
      <label>Trade</label>
      <select id="edit-trade">
        ${['Framing','Concrete','Roofing','Electrical','Plumbing','HVAC','Drywall','Flooring','Excavation','Landscaping','General Contractor','Other']
          .map(t=>`<option ${p.trade===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <label>Phone</label>
      <input id="edit-phone" value="${p.phone||''}" placeholder="435-555-0100"/>
      <button class="btn btn-primary btn-block" onclick="saveProfile()">Save</button>
    </div>
    <button class="btn btn-outline btn-block mt8" onclick="signOut()">Sign Out</button>
  `;
}
async function saveProfile(){
  const updates = {
    full_name: document.getElementById('edit-name').value,
    company:   document.getElementById('edit-company').value,
    trade:     document.getElementById('edit-trade').value,
    phone:     document.getElementById('edit-phone').value,
  };
  const {error} = await sb.from('profiles').update(updates).eq('id',STATE.user.id);
  if (error){alert(error.message);return;}
  STATE.profile = {...STATE.profile,...updates};
  renderProfile();
}

// ─── ADMIN ────────────────────────────────────────────────────────────────────
// Ported from app.html's Admin tab, adapted to the columns actually
// confirmed live (no jobs.hired_by/trade_type — those never existed on
// the real table). Gated cosmetically on STATE.isAdmin (nav button
// hidden unless profiles.is_admin is true) -- real enforcement is the
// "Admins have full access" RLS policies from admin-setup.sql.
function loadAdmin(){
  if (STATE.admLoaded) return;
  STATE.admLoaded = true;
  admLoadUsers();
}
function admTab(tab,btn){
  STATE.activeAdmTab = tab;
  document.querySelectorAll('.adm-subtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.adm-subview').forEach(v=>v.classList.remove('active'));
  document.getElementById('adm-'+tab).classList.add('active');
  if (tab==='jobs') admLoadJobs(); else admLoadUsers();
}
async function admLoadUsers(){
  const el = document.getElementById('adm-users');
  el.innerHTML = '<p class="text-muted" style="padding:20px 0">Loading…</p>';
  const {data,error} = await sb.from('profiles').select('id,email,full_name,tier,jobs_completed,is_admin').order('created_at',{ascending:false});
  if (error){el.innerHTML = `<p class="text-muted" style="padding:20px 0">Could not load users. ${error.message}</p>`;return;}
  admRenderUsers(data||[]);
}
function admRenderUsers(users){
  const el = document.getElementById('adm-users');
  if (!users.length){el.innerHTML='<p class="text-muted" style="padding:20px 0">No users yet.</p>';return;}
  el.innerHTML = users.map(u=>`
    <div class="card">
      <div class="adm-row">
        <div>
          <h3>${u.full_name||u.email}</h3>
          <p class="text-muted">Tier ${u.tier!=null?u.tier:'--'} · ${u.jobs_completed||0} jobs done</p>
        </div>
        <span class="adm-badge ${u.is_admin?'adm-badge-admin':'adm-badge-user'}">${u.is_admin?'Admin':'User'}</span>
      </div>
      <button class="btn btn-sm mt8 ${u.is_admin?'btn-outline':'btn-primary'}" onclick="admSetAdmin('${u.id}',${!u.is_admin})">${u.is_admin?'Revoke Admin':'Make Admin'}</button>
    </div>`).join('');
}
async function admSetAdmin(id,value){
  if (!confirm(value?'Grant full administrator access to this user?':'Revoke administrator access from this user?')) return;
  const {error} = await sb.from('profiles').update({is_admin:value}).eq('id',id);
  if (error){alert('Could not update admin status. '+error.message);return;}
  admLoadUsers();
}
async function admLoadJobs(){
  const el = document.getElementById('adm-jobs');
  el.innerHTML = '<p class="text-muted" style="padding:20px 0">Loading…</p>';
  const {data,error} = await sb.from('jobs').select('id,title,trade,owner_id,status').order('created_at',{ascending:false});
  if (error){el.innerHTML = `<p class="text-muted" style="padding:20px 0">Could not load jobs. ${error.message}</p>`;return;}
  const jobs = data||[];
  const ids = [...new Set(jobs.map(j=>j.owner_id).filter(Boolean))];
  const profiles = await admFetchProfiles(ids);
  admRenderJobs(jobs,profiles);
}
async function admFetchProfiles(ids){
  const map = {};
  if (!ids.length) return map;
  const {data} = await sb.from('profiles').select('id,full_name,email').in('id',ids);
  (data||[]).forEach(p=>{map[p.id]=p;});
  return map;
}
function admRenderJobs(jobs,profiles){
  const el = document.getElementById('adm-jobs');
  if (!jobs.length){el.innerHTML='<p class="text-muted" style="padding:20px 0">No jobs yet.</p>';return;}
  const statuses = ['open','filled','closed'];
  el.innerHTML = jobs.map(j=>{
    const poster = profiles[j.owner_id];
    const posterName = poster ? (poster.full_name||poster.email) : '--';
    return `
    <div class="card">
      <h3>${j.title}</h3>
      <p class="text-muted">${j.trade||'--'} · Posted by ${posterName}</p>
      <div class="flex gap8 mt8" style="align-items:center;flex-wrap:wrap">
        <select style="width:auto;margin-bottom:0" onchange="admUpdateJobStatus('${j.id}',this.value)">
          ${statuses.map(s=>`<option value="${s}" ${s===j.status?'selected':''}>${s}</option>`).join('')}
        </select>
        <button class="btn btn-danger btn-sm" onclick="admDeleteJob('${j.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}
async function admUpdateJobStatus(id,status){
  const {error} = await sb.from('jobs').update({status}).eq('id',id);
  if (error){alert('Could not update job status. '+error.message);admLoadJobs();}
}
async function admDeleteJob(id){
  if (!confirm('Permanently delete this job? This cannot be undone.')) return;
  const {error} = await sb.from('jobs').delete().eq('id',id);
  if (error){alert('Could not delete job. '+error.message);return;}
  admLoadJobs();
}

// ─── RATINGS ──────────────────────────────────────────────────────────────────
function openRating(jobId,revieweeId){
  STATE.currentRatingJobId=jobId;STATE.currentRatingRevieweeId=revieweeId;STATE.currentRating=0;
  document.querySelectorAll('#star-picker span').forEach(s=>s.classList.remove('on'));
  document.getElementById('review-text').value='';
  document.getElementById('rating-overlay').classList.add('open');
}
function setRating(n){
  STATE.currentRating=n;
  document.querySelectorAll('#star-picker span').forEach((s,i)=>s.classList.toggle('on',i<n));
}
async function submitRating(){
  if (!STATE.currentRating){alert('Select a rating');return;}
  if (!STATE.currentRatingRevieweeId){alert('Could not determine who this review is for.');return;}
  const {error} = await sb.from('reviews').insert({
    job_id:      STATE.currentRatingJobId,
    reviewer_id: STATE.user.id,
    reviewee_id: STATE.currentRatingRevieweeId, // the job's poster — set by openRating(), not the reviewer
    rating:      STATE.currentRating,
    body:        document.getElementById('review-text').value
  });
  if (error){alert(error.message);return;}
  closeOverlay('rating-overlay');
}
function closeOverlay(id){document.getElementById(id).classList.remove('open');}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(async()=>{
  const errEl = document.getElementById('auth-error');
  if (!sb){ if(errEl) errEl.textContent = SB_LOAD_ERROR; return; }
  try {
    const {data:{session}} = await sb.auth.getSession();
    if (session?.user) await onLogin(session.user);
  } catch (e) {
    // Session restore / initial load failed — fall back to the sign-in form
    // rather than a blank or half-rendered app.
    document.getElementById('auth-wrap').style.display = '';
    document.getElementById('app').style.display = 'none';
    document.getElementById('main-nav').style.display = 'none';
    if (errEl) errEl.textContent = 'Could not restore your session. Please sign in.';
  }
})();
</script>
<!-- TradeDeck Shield UI (mountable module). Loaded after the main script so it
     can read the shared `sb` client; functions attach to window. -->
<script src="shield.js"></script>

<!-- PWA: installable + auto-update. Service worker is network-first, so a new
     deploy is fetched when online; this shows a one-tap refresh when a new
     version is ready. -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      function showUpdate(worker) {
        let bar = document.getElementById('pwa-update');
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'pwa-update';
          bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:78px;z-index:300;background:#0BBCD4;color:#0A0A0A;font-weight:700;font-size:14px;padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.4)';
          bar.innerHTML = '<span>New version available</span>';
          const btn = document.createElement('button');
          btn.textContent = 'Refresh';
          btn.style.cssText = 'background:#0A0A0A;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer';
          btn.onclick = () => worker.postMessage({ type: 'SKIP_WAITING' });
          bar.appendChild(btn);
          document.body.appendChild(bar);
        }
      }
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(nw);
        });
      });
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return; reloaded = true; window.location.reload();
    });
  });
}
</script>
