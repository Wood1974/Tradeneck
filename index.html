<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeDeck — Sign In</title>

  <!-- CSP -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co https://*.supabase.io wss://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ── Tokens ── */
    :root {
      --spruce:  #1C3A2F;
      --brass:   #B8892A;
      --bone:    #F5F0E8;
      --slate:   #2E3A35;
      --mist:    #E8E3DA;
      --error:   #C0392B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: var(--spruce);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      padding: 24px 16px;
    }

    /* ── Wordmark ── */
    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 36px;
      user-select: none;
    }
    .wordmark-trade {
      font-size: 28px;
      font-weight: 700;
      color: var(--bone);
      letter-spacing: -0.5px;
    }
    .wordmark-deck {
      font-size: 28px;
      font-weight: 400;
      color: var(--brass);
      letter-spacing: -0.5px;
    }
    .wordmark-tag {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      color: var(--brass);
      opacity: 0.75;
      text-transform: uppercase;
      margin-top: 4px;
      text-align: center;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--bone);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--mist);
    }
    .tab {
      flex: 1;
      padding: 14px;
      background: none;
      border: none;
      font-family: 'Georgia', serif;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      transition: color 0.15s;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      text-align: center;
    }
    .tab.active {
      color: var(--spruce);
      font-weight: 700;
      border-bottom-color: var(--brass);
    }

    /* ── Panel ── */
    .panel {
      display: none;
      padding: 28px 24px 32px;
      flex-direction: column;
      gap: 16px;
    }
    .panel.active { display: flex; }

    /* ── Form elements ── */
    label {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--slate);
      margin-bottom: 4px;
      display: block;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--mist);
      border-radius: 3px;
      background: #fff;
      font-size: 15px;
      font-family: 'Georgia', serif;
      color: var(--slate);
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus { border-color: var(--brass); }

    /* ── Role selector ── */
    .role-group {
      display: flex;
      gap: 8px;
    }
    .role-btn {
      flex: 1;
      padding: 10px 8px;
      background: #fff;
      border: 1.5px solid var(--mist);
      border-radius: 3px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #888;
      cursor: pointer;
      transition: all 0.15s;
    }
    .role-btn.selected {
      background: var(--spruce);
      border-color: var(--spruce);
      color: var(--bone);
    }

    /* ── Submit ── */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--brass);
      border: none;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    .btn-primary:hover { background: #a07520; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    /* ── Messages ── */
    .msg {
      font-size: 13px;
      font-family: 'Georgia', serif;
      padding: 10px 12px;
      border-radius: 3px;
      display: none;
    }
    .msg.error  { background: #fdf0ef; color: var(--error); border: 1px solid #f5c6c4; display: block; }
    .msg.success { background: #eef6f0; color: #1d6636; border: 1px solid #b3dfc0; display: block; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #aaa;
      font-size: 11px;
      font-family: 'Courier New', monospace;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--mist);
    }

    /* ── Footer note ── */
    .footer-note {
      margin-top: 20px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.35);
      text-align: center;
    }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--spruce);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(184,137,42,0.3);
      border-top-color: var(--brass);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Initial session check overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <div class="wordmark">
    <div>
      <div style="display:flex;align-items:baseline;gap:6px;">
        <span class="wordmark-trade">Trade</span><span class="wordmark-deck">Deck</span>
      </div>
      <div class="wordmark-tag">Built for the Trades</div>
    </div>
  </div>

  <div class="card">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('signin')">Sign In</button>
      <button class="tab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- Sign In Panel -->
    <div id="panel-signin" class="panel active">
      <div id="signin-msg" class="msg"></div>

      <div class="field">
        <label for="signin-email">Email</label>
        <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn-primary" id="signin-btn" onclick="handleSignIn()">Sign In</button>

      <div class="divider">or</div>

      <button class="btn-primary" style="background:var(--spruce);" onclick="handleMagicLink()">Send Magic Link</button>
    </div>

    <!-- Create Account Panel -->
    <div id="panel-signup" class="panel">
      <div id="signup-msg" class="msg"></div>

      <div class="field">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" placeholder="Austin Draper" autocomplete="name" />
      </div>

      <div class="field">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="8+ characters" autocomplete="new-password" />
      </div>

      <div class="field">
        <label>I am a</label>
        <div class="role-group">
          <button class="role-btn selected" id="role-contractor" onclick="selectRole('contractor')">Contractor</button>
          <button class="role-btn" id="role-worker" onclick="selectRole('worker')">Worker / Sub</button>
          <button class="role-btn" id="role-owner" onclick="selectRole('owner')">Property Owner</button>
        </div>
      </div>

      <button class="btn-primary" id="signup-btn" onclick="handleSignUp()">Create Account</button>
    </div>

  </div>

  <div class="footer-note">tradedeckapp.com &nbsp;·&nbsp; By invitation &amp; open signup</div>

  <script>
    // ── Supabase init ──
    const { createClient } = supabase;
    const SUPABASE_URL = 'https://jlaajejpqjldpbinktln.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsYWFqZWpwcWpsZHBiaW5rdGxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDg3MTksImV4cCI6MjEwMTc4NDcxOX0.tP-seLGoJnivrYmNhhTDmDJw4Uk92D95-zrwWB1G_S4';
    const db = createClient(SUPABASE_URL, SUPABASE_ANON);

    // ── Session check on load ──
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      document.getElementById('loading-overlay').style.display = 'none';
      if (session) {
        window.location.replace('app.html');
      }
    })();

    // ── Tab switching ──
    let activeTab = 'signin';
    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'signin') || (i === 1 && tab === 'signup'));
      });
      document.getElementById('panel-signin').classList.toggle('active', tab === 'signin');
      document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
      clearMsgs();
    }

    // ── Role selection ──
    let selectedRole = 'contractor';
    function selectRole(role) {
      selectedRole = role;
      ['contractor','worker','owner'].forEach(r => {
        document.getElementById('role-' + r).classList.toggle('selected', r === role);
      });
    }

    // ── Helpers ──
    function showMsg(panelId, text, type) {
      const el = document.getElementById(panelId + '-msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }
    function clearMsgs() {
      ['signin-msg','signup-msg'].forEach(id => {
        const el = document.getElementById(id);
        el.textContent = '';
        el.className = 'msg';
      });
    }
    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Please wait…' : btn.dataset.label;
    }

    // Store default labels
    window.addEventListener('DOMContentLoaded', () => {
      ['signin-btn','signup-btn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.dataset.label = el.textContent;
      });
    });

    // ── Sign In ──
    async function handleSignIn() {
      clearMsgs();
      const email    = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;
      if (!email || !password) { showMsg('signin', 'Email and password required.', 'error'); return; }

      setLoading('signin-btn', true);
      const { error } = await db.auth.signInWithPassword({ email, password });
      setLoading('signin-btn', false);

      if (error) { showMsg('signin', error.message, 'error'); return; }
      window.location.replace('app.html');
    }

    // ── Magic Link ──
    async function handleMagicLink() {
      clearMsgs();
      const email = document.getElementById('signin-email').value.trim();
      if (!email) { showMsg('signin', 'Enter your email first.', 'error'); return; }

      const { error } = await db.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: 'https://tradedeckapp.com/app.html' }
      });

      if (error) { showMsg('signin', error.message, 'error'); return; }
      showMsg('signin', 'Magic link sent — check your email.', 'success');
    }

    // ── Sign Up ──
    async function handleSignUp() {
      clearMsgs();
      const name     = document.getElementById('signup-name').value.trim();
      const email    = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;

      if (!name)              { showMsg('signup', 'Enter your full name.', 'error'); return; }
      if (!email)             { showMsg('signup', 'Enter your email.', 'error'); return; }
      if (password.length < 8){ showMsg('signup', 'Password must be 8+ characters.', 'error'); return; }

      setLoading('signup-btn', true);
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name, role: selectedRole },
          emailRedirectTo: 'https://tradedeckapp.com/app.html'
        }
      });
      setLoading('signup-btn', false);

      if (error) { showMsg('signup', error.message, 'error'); return; }

      // If Supabase requires email confirmation
      if (data.user && !data.session) {
        showMsg('signup', 'Account created! Check your email to confirm, then sign in.', 'success');
        return;
      }

      // Immediate session (email confirmation off)
      window.location.replace('app.html');
    }

    // Handle magic link return (hash fragment from Supabase)
    db.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        window.location.replace('app.html');
      }
    });
  </script>

</body>
</html>
