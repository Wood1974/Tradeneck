<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TradeDeck</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0A;--surface:#141414;--border:#222;
  --teal:#0BBCD4;--text:#F0F0F0;--muted:#888;--danger:#e05555;--green:#4ADE80;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:100}
nav button{flex:1;padding:12px 4px 10px;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
nav button.active{color:var(--teal)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
#app{padding:16px 16px 80px}
.screen{display:none}.screen.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:6px}
.card p{font-size:13px;color:var(--muted);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--teal);color:#000}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-block{width:100%;margin-top:8px}
input,textarea,select{width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:10px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{min-height:80px;resize:vertical}
label{font-size:13px;color:var(--muted);margin-bottom:4px;display:block}
.tab-bar{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.tab-btn{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:13px;cursor:pointer}
.tab-btn.active{background:var(--teal);color:#000;border-color:var(--teal)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-teal{background:rgba(11,188,212,.15);color:var(--teal)}
.badge-ksl{background:rgba(255,180,0,.15);color:#ffb400}
.screen-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.screen-header h2{font-size:20px;font-weight:700}
#auth-wrap{max-width:400px;margin:60px auto;padding:0 16px}
#auth-wrap h1{font-size:26px;font-weight:800;margin-bottom:6px}
#auth-wrap p.sub{color:var(--muted);margin-bottom:24px}
.auth-toggle{font-size:13px;color:var(--muted);margin-top:12px;text-align:center;cursor:pointer}
.auth-toggle span{color:var(--teal)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-end}
.overlay.open{display:flex}
.overlay-inner{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-height:90vh;overflow-y:auto}
.overlay-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.overlay-header h3{font-size:17px;font-weight:700}
.close-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
.flex{display:flex}.between{justify-content:space-between}.gap8{gap:8px}.mt8{margin-top:8px}.mt16{margin-top:16px}
.text-muted{color:var(--muted);font-size:13px}
.draw-status{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase}
.draw-status.pending{background:rgba(255,180,0,.15);color:#ffb400}
.draw-status.submitted{background:rgba(11,188,212,.15);color:var(--teal)}
.draw-status.approved{background:rgba(74,222,128,.15);color:var(--green)}
.draw-status.disputed{background:rgba(224,85,85,.15);color:var(--danger)}
.escrow-bar{background:var(--border);border-radius:4px;height:8px;margin:8px 0}
.escrow-fill{background:var(--teal);height:100%;border-radius:4px;transition:width .4s}
.stars{display:flex;gap:6px;font-size:28px;cursor:pointer;margin:10px 0}
.stars span{color:var(--border);transition:color .1s}
.stars span.on{color:#ffb400}
.milestone-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.milestone-row input{margin-bottom:0}
.milestone-row .pct-input{width:65px;flex-shrink:0;text-align:center}
.county-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.county-tab{white-space:nowrap;padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:none;color:var(--muted);font-size:12px;cursor:pointer;flex-shrink:0}
.county-tab.active{background:var(--teal);color:#000;border-color:var(--teal)}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-wrap">
  <h1>TradeDeck</h1>
  <p class="sub">The marketplace built for the trades.</p>
  <label>Email</label>
  <input id="auth-email" type="email" placeholder="you@example.com"/>
  <label>Password</label>
  <input id="auth-password" type="password" placeholder="••••••••"/>
  <button class="btn btn-primary btn-block" onclick="authSubmit()">Sign In</button>
  <p id="auth-error" style="color:var(--danger);font-size:13px;margin-top:8px"></p>
  <p class="auth-toggle">No account? <span onclick="toggleAuth()">Sign up</span></p>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <!-- HOME -->
  <div id="screen-home" class="screen active">
    <div class="screen-header"><h2>Home</h2><span id="home-tier" class="badge badge-teal"></span></div>
    <div id="home-stats" class="card"></div>
    <div class="card">
      <h3>Quick Actions</h3>
      <div class="flex gap8 mt8">
        <button class="btn btn-primary btn-sm" onclick="switchTab('post')">Post a Job</button>
        <button class="btn btn-outline btn-sm" onclick="switchTab('work')">Find Work</button>
      </div>
    </div>
  </div>

  <!-- FIND WORK -->
  <div id="screen-work" class="screen">
    <div class="screen-header"><h2>Find Work</h2></div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="workTab('open',this)">Open Jobs</button>
      <button class="tab-btn" onclick="workTab('ksl',this)">KSL Jobs</button>
      <button class="tab-btn" onclick="workTab('leads',this)">Lead Sources</button>
    </div>
    <div class="county-tabs" id="county-tabs" style="display:none"></div>
    <div id="work-content"></div>
  </div>

  <!-- POST A JOB -->
  <div id="screen-post" class="screen">
    <div class="screen-header"><h2>Post a Job</h2></div>
    <div class="card">
      <label>Job Title</label>
      <input id="post-title" placeholder="e.g. Framing crew needed — custom home"/>
      <label>Trade</label>
      <select id="post-trade">
        <option>Framing</option><option>Concrete</option><option>Roofing</option>
        <option>Electrical</option><option>Plumbing</option><option>HVAC</option>
        <option>Drywall</option><option>Flooring</option><option>Excavation</option>
        <option>Landscaping</option><option>General Labor</option><option>Other</option>
      </select>
      <label>Location / City</label>
      <input id="post-city" placeholder="e.g. Francis"/>
      <label>County</label>
      <select id="post-county">
        <option>Summit</option><option>Wasatch</option><option>Utah</option>
        <option>Salt Lake</option><option>Davis</option><option>Weber</option>
        <option>Cache</option><option>Tooele</option><option>Juab</option>
        <option>Sanpete</option><option>Sevier</option><option>Millard</option>
        <option>Iron</option><option>Washington</option><option>Kane</option>
        <option>Garfield</option><option>Piute</option><option>Wayne</option>
        <option>Emery</option><option>Carbon</option><option>Grand</option>
        <option>San Juan</option><option>Uintah</option><option>Duchesne</option>
        <option>Daggett</option><option>Morgan</option><option>Rich</option>
        <option>Box Elder</option><option>Other</option>
      </select>
      <label>Description</label>
      <textarea id="post-desc" placeholder="Scope, timeline, crew size…"></textarea>
      <label>Budget / Rate</label>
      <input id="post-budget" placeholder="e.g. $85,000 or $45/hr"/>
      <hr style="border:none;border-top:1px solid var(--border);margin:16px 0"/>
      <h3 style="margin-bottom:10px">Draw Schedule <span class="text-muted">(optional)</span></h3>
      <div id="milestone-rows"></div>
      <div class="flex gap8 mt8">
        <button class="btn btn-outline btn-sm" onclick="addMilestone()">+ Milestone</button>
        <span id="pct-total" class="text-muted" style="align-self:center;font-size:13px"></span>
      </div>
      <button class="btn btn-primary btn-block mt16" onclick="submitJob()">Post Job</button>
    </div>
  </div>

  <!-- DRAW MANAGER -->
  <div id="screen-draws" class="screen">
    <div class="screen-header"><h2>Draw Manager</h2></div>
    <div id="draws-content"></div>
  </div>

  <!-- PROFILE -->
  <div id="screen-profile" class="screen">
    <div class="screen-header"><h2>Profile</h2></div>
    <div id="profile-content"></div>
  </div>

</div>

<!-- NAV -->
<nav id="main-nav" style="display:none">
  <button class="active" onclick="switchTab('home')" id="nav-home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home
  </button>
  <button onclick="switchTab('work')" id="nav-work">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>Find Work
  </button>
  <button onclick="switchTab('post')" id="nav-post">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Post Job
  </button>
  <button onclick="switchTab('draws')" id="nav-draws">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Draws
  </button>
  <button onclick="switchTab('profile')" id="nav-profile">
    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile
  </button>
</nav>

<!-- RATING OVERLAY -->
<div class="overlay" id="rating-overlay">
  <div class="overlay-inner">
    <div class="overlay-header">
      <h3>Rate this Job</h3>
      <button class="close-btn" onclick="closeOverlay('rating-overlay')">×</button>
    </div>
    <div class="stars" id="star-picker">
      <span onclick="setRating(1)">★</span><span onclick="setRating(2)">★</span>
      <span onclick="setRating(3)">★</span><span onclick="setRating(4)">★</span>
      <span onclick="setRating(5)">★</span>
    </div>
    <textarea id="review-text" placeholder="Share your experience (optional)…"></textarea>
    <button class="btn btn-primary btn-block" onclick="submitRating()">Submit Rating</button>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SUPABASE_URL     = 'https://jlaajejpqjldpbinktln.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsYWFqZWpwcWpsZHBiaW5rdGxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMDg3MTksImV4cCI6MjEwMTc4NDcxOX0.tP-seLGoJnivrYmNhhTDmDJw4Uk92D95-zrwWB1G_S4';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─── STATE ────────────────────────────────────────────────────────────────────
let STATE = {
  user:null, profile:null,
  jobs:[], kslJobs:[], draws:[],
  activeWorkTab:'open', activeCounty:'all',
  currentRatingJobId:null, currentRating:0,
  milestones:[]
};

// ─── AUTH ─────────────────────────────────────────────────────────────────────
let authMode = 'signin';
function toggleAuth() {
  authMode = authMode==='signin'?'signup':'signin';
  document.querySelector('#auth-wrap button').textContent = authMode==='signin'?'Sign In':'Create Account';
  document.querySelector('.auth-toggle span').textContent = authMode==='signin'?'Sign up':'Sign in';
}
async function authSubmit() {
  const email    = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl    = document.getElementById('auth-error');
  errEl.textContent = '';
  if (!email||!password){errEl.textContent='Email and password required';return;}
  const res = authMode==='signup'
    ? await sb.auth.signUp({email,password})
    : await sb.auth.signInWithPassword({email,password});
  if (res.error){errEl.textContent=res.error.message;return;}
  if (authMode==='signup'&&!res.error){errEl.style.color='var(--green)';errEl.textContent='Check your email to confirm.';return;}
  await onLogin(res.data.user);
}
async function onLogin(user) {
  STATE.user = user;
  let {data:profile} = await sb.from('profiles').select('*').eq('id',user.id).single();
  if (!profile) {
    await sb.from('profiles').insert({id:user.id,email:user.email});
    profile = {id:user.id,email:user.email,tier:1};
  }
  STATE.profile = profile;
  document.getElementById('auth-wrap').style.display = 'none';
  document.getElementById('app').style.display       = 'block';
  document.getElementById('main-nav').style.display  = 'flex';
  await loadData();
  render();
}
async function signOut(){await sb.auth.signOut();location.reload();}

// ─── LOAD DATA ────────────────────────────────────────────────────────────────
async function loadData() {
  const [jobsRes, drawRes, kslRes] = await Promise.all([
    sb.from('jobs').select('*').eq('status','open').eq('source','tradedeck').order('created_at',{ascending:false}).limit(50),
    sb.from('draw_schedules').select('*, draws(*)').order('created_at',{ascending:false}).limit(30),
    sb.from('jobs').select('*').eq('source','ksl').order('created_at',{ascending:false}).limit(200),
  ]);
  STATE.jobs    = jobsRes.data  || [];
  STATE.draws   = drawRes.data  || [];
  STATE.kslJobs = kslRes.data   || [];
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
}
function workTab(tab,btn) {
  STATE.activeWorkTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('county-tabs').style.display = tab==='ksl'?'flex':'none';
  renderWork();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){renderHome();renderWork();renderDraws();renderProfile();}

function renderHome() {
  if (!STATE.profile) return;
  const tiers = ['','Verified','Active','Proven','Trusted','TradeDeck Pro'];
  document.getElementById('home-tier').textContent = tiers[STATE.profile.tier||1]||'Verified';
  document.getElementById('home-stats').innerHTML = `
    <div class="flex between"><span class="text-muted">Jobs available</span><strong>${STATE.jobs.length}</strong></div>
    <div class="flex between mt8"><span class="text-muted">Active draws</span><strong>${STATE.draws.length}</strong></div>
  `;
}

const COUNTIES = ['All','Box Elder','Cache','Carbon','Daggett','Davis','Duchesne','Emery',
  'Garfield','Grand','Iron','Juab','Kane','Millard','Morgan','Piute','Rich','Salt Lake',
  'San Juan','Sanpete','Sevier','Summit','Tooele','Uintah','Utah','Wasatch','Washington','Wayne','Weber'];

function renderWork() {
  const el = document.getElementById('work-content');
  const countyEl = document.getElementById('county-tabs');
  if (STATE.activeWorkTab==='ksl') {
    countyEl.style.display = 'flex';
    countyEl.innerHTML = COUNTIES.map(c=>`
      <button class="county-tab${(c==='All'&&STATE.activeCounty==='all')||(c===STATE.activeCounty)?' active':''}"
        onclick="filterCounty('${c==='All'?'all':c}',this)">${c}</button>`).join('');
    const jobs = STATE.activeCounty==='all'?STATE.kslJobs:STATE.kslJobs.filter(j=>j.county===STATE.activeCounty);
    el.innerHTML = jobs.length ? jobs.map(j=>`
      <div class="card">
        <div class="flex between"><h3>${j.title}</h3><span class="badge badge-ksl">KSL</span></div>
        <p>${j.company||''} · ${j.city||''}, ${j.county||''}</p>
        <p style="margin-top:6px">${(j.description||'').slice(0,120)}…</p>
        <p class="text-muted" style="margin-top:4px;font-size:12px">${j.rate||''}</p>
      </div>`).join('') : '<p class="text-muted" style="padding:20px 0">No KSL jobs in this area yet.</p>';
  } else if (STATE.activeWorkTab==='leads') {
    countyEl.style.display = 'none';
    const leads = [
      {name:'PermitStack',desc:'Utah building permits — new construction signals'},
      {name:'KSL Classifieds',desc:'FSBO and contractor listings'},
      {name:'BuildZoom',desc:'Permit and contractor history'},
      {name:'Angi',desc:'Homeowner requests in your area'},
      {name:'Thumbtack',desc:'Local project leads'},
      {name:'Google LSA',desc:'Local Services Ads leads'},
      {name:'HomeAdvisor',desc:'Homeowner project matching'},
      {name:'Houzz Pro',desc:'Design-build and remodel leads'},
      {name:'NextDoor',desc:'Neighborhood contractor recommendations'},
      {name:'Facebook Marketplace',desc:'Local contractor demand'},
      {name:'Craigslist',desc:'Gig and subcontractor postings'},
    ];
    el.innerHTML = leads.map(l=>`<div class="card"><h3>${l.name}</h3><p>${l.desc}</p></div>`).join('');
  } else {
    countyEl.style.display = 'none';
    el.innerHTML = STATE.jobs.length ? STATE.jobs.map(j=>`
      <div class="card">
        <div class="flex between"><h3>${j.title}</h3><span class="badge badge-teal">${j.trade||'Trade'}</span></div>
        <p>${j.city||''}, ${j.county||''}</p>
        <p style="margin-top:4px">${j.rate||j.budget||''}</p>
        <p class="text-muted" style="margin-top:6px;font-size:12px">${(j.description||'').slice(0,100)}</p>
        <button class="btn btn-outline btn-sm mt8" onclick="openRating('${j.id}')">Rate Job</button>
      </div>`).join('') : '<p class="text-muted" style="padding:20px 0">No open jobs yet. Be the first to post.</p>';
  }
}
function filterCounty(county,btn){
  STATE.activeCounty=county;
  document.querySelectorAll('.county-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderWork();
}

// ─── POST JOB ─────────────────────────────────────────────────────────────────
let milestones = [];
function addMilestone(){milestones.push({name:'',pct:0,verifier:'owner'});renderMilestones();}
function removeMilestone(i){milestones.splice(i,1);renderMilestones();}
function renderMilestones(){
  const el = document.getElementById('milestone-rows');
  el.innerHTML = milestones.map((m,i)=>`
    <div class="milestone-row">
      <input placeholder="Name" value="${m.name}" oninput="milestones[${i}].name=this.value"/>
      <input class="pct-input" type="number" placeholder="%" value="${m.pct||''}" min="1" max="100"
        oninput="milestones[${i}].pct=+this.value;updatePct()"/>
      <select style="width:100px;margin-bottom:0" onchange="milestones[${i}].verifier=this.value">
        <option value="owner" ${m.verifier==='owner'?'selected':''}>Owner</option>
        <option value="inspector" ${m.verifier==='inspector'?'selected':''}>Inspector</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="removeMilestone(${i})">✕</button>
    </div>`).join('');
  updatePct();
}
function updatePct(){
  const total = milestones.reduce((s,m)=>s+(+m.pct||0),0);
  const el = document.getElementById('pct-total');
  el.textContent = milestones.length?`${total}% of 100%`:'';
  el.style.color = total===100?'var(--green)':total>100?'var(--danger)':'var(--muted)';
}
async function submitJob(){
  const title = document.getElementById('post-title').value.trim();
  if (!title){alert('Title required');return;}
  const total = milestones.reduce((s,m)=>s+(+m.pct||0),0);
  if (milestones.length&&total!==100){alert('Draw percentages must total 100%');return;}
  const {data:job,error} = await sb.from('jobs').insert({
    title,
    trade:    document.getElementById('post-trade').value,
    city:     document.getElementById('post-city').value,
    county:   document.getElementById('post-county').value,
    state:    'UT',
    description: document.getElementById('post-desc').value,
    rate:     document.getElementById('post-budget').value,
    user_id:  STATE.user.id,
    source:   'tradedeck',
    status:   'open'
  }).select().single();
  if (error){alert('Error: '+error.message);return;}
  if (milestones.length) {
    const budget = parseInt(document.getElementById('post-budget').value.replace(/\D/g,''))||0;
    const {data:sched} = await sb.from('draw_schedules').insert({
      job_id:         job.id,
      owner_id:       STATE.user.id,
      contract_value: budget||1
    }).select().single();
    if (sched) {
      await sb.from('draws').insert(milestones.map((m,i)=>({
        schedule_id:  sched.id,
        position:     i+1,
        name:         m.name,
        pct:          m.pct,
        amount_cents: Math.round((budget||1)*100*(m.pct/100)),
        verifier_type:m.verifier,
        status:       'pending'
      })));
    }
  }
  milestones=[];renderMilestones();
  ['post-title','post-city','post-desc','post-budget'].forEach(id=>document.getElementById(id).value='');
  await loadData();render();
  switchTab('work');
}

// ─── DRAW MANAGER ─────────────────────────────────────────────────────────────
function renderDraws(){
  const el = document.getElementById('draws-content');
  if (!STATE.draws.length){
    el.innerHTML='<p class="text-muted" style="padding:20px 0">No draw schedules yet. Add milestones when posting a job.</p>';
    return;
  }
  el.innerHTML = STATE.draws.map(s=>{
    const draws = (s.draws||[]).sort((a,b)=>a.position-b.position);
    const releasedPct = draws.filter(d=>d.status==='approved'||d.status==='released').reduce((sum,d)=>sum+d.pct,0);
    return `<div class="card">
      <div class="flex between"><h3>Draw Schedule</h3><span class="text-muted">$${(s.contract_value||0).toLocaleString()}</span></div>
      <div class="escrow-bar"><div class="escrow-fill" style="width:${releasedPct}%"></div></div>
      <p class="text-muted" style="font-size:12px;margin-bottom:12px">${releasedPct}% released</p>
      ${draws.map(d=>`
        <div class="flex between mt8" style="align-items:center">
          <span style="font-size:14px">${d.position}. ${d.name} <span class="text-muted">(${d.pct}%)</span></span>
          <div class="flex gap8" style="align-items:center">
            <span class="draw-status ${d.status}">${d.status}</span>
            ${d.status==='pending'?`<button class="btn btn-outline btn-sm" onclick="drawAction('${d.id}','submitted')">Submit</button>`:''}
            ${d.status==='submitted'?`
              <button class="btn btn-primary btn-sm" onclick="drawAction('${d.id}','approved')">Approve</button>
              <button class="btn btn-danger btn-sm" onclick="drawAction('${d.id}','disputed')">Dispute</button>`:''}
          </div>
        </div>`).join('')}
    </div>`;
  }).join('');
}
async function drawAction(id,status){
  await sb.from('draws').update({status,resolved_at:['approved','disputed'].includes(status)?new Date().toISOString():null}).eq('id',id);
  await loadData();renderDraws();
}

// ─── PROFILE ──────────────────────────────────────────────────────────────────
function renderProfile(){
  const el = document.getElementById('profile-content');
  if (!STATE.profile){el.innerHTML='';return;}
  const p = STATE.profile;
  const tiers=['','Verified','Active','Proven','Trusted','TradeDeck Pro'];
  el.innerHTML=`
    <div class="card">
      <h3>${p.full_name||p.email}</h3>
      <p class="text-muted">${p.trade||'No trade set'} · Tier: ${tiers[p.tier||1]||'Verified'}</p>
      ${p.rating>0?`<p class="text-muted" style="margin-top:4px">★ ${p.rating} · ${p.repeat_hire_rate}% repeat hire</p>`:''}
    </div>
    <div class="card">
      <h3>Edit Profile</h3>
      <label>Full Name</label>
      <input id="edit-name" value="${p.full_name||''}"/>
      <label>Company</label>
      <input id="edit-company" value="${p.company||''}"/>
      <label>Trade</label>
      <select id="edit-trade">
        ${['Framing','Concrete','Roofing','Electrical','Plumbing','HVAC','Drywall','Flooring','Excavation','Landscaping','General Contractor','Other']
          .map(t=>`<option ${p.trade===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <label>Phone</label>
      <input id="edit-phone" value="${p.phone||''}" placeholder="435-555-0100"/>
      <button class="btn btn-primary btn-block" onclick="saveProfile()">Save</button>
    </div>
    <button class="btn btn-outline btn-block mt8" onclick="signOut()">Sign Out</button>
  `;
}
async function saveProfile(){
  const updates = {
    full_name: document.getElementById('edit-name').value,
    company:   document.getElementById('edit-company').value,
    trade:     document.getElementById('edit-trade').value,
    phone:     document.getElementById('edit-phone').value,
  };
  const {error} = await sb.from('profiles').update(updates).eq('id',STATE.user.id);
  if (error){alert(error.message);return;}
  STATE.profile = {...STATE.profile,...updates};
  renderProfile();
}

// ─── RATINGS ──────────────────────────────────────────────────────────────────
function openRating(jobId){
  STATE.currentRatingJobId=jobId;STATE.currentRating=0;
  document.querySelectorAll('#star-picker span').forEach(s=>s.classList.remove('on'));
  document.getElementById('review-text').value='';
  document.getElementById('rating-overlay').classList.add('open');
}
function setRating(n){
  STATE.currentRating=n;
  document.querySelectorAll('#star-picker span').forEach((s,i)=>s.classList.toggle('on',i<n));
}
async function submitRating(){
  if (!STATE.currentRating){alert('Select a rating');return;}
  const {error} = await sb.from('reviews').insert({
    job_id:      STATE.currentRatingJobId,
    reviewer_id: STATE.user.id,
    reviewee_id: STATE.user.id, // placeholder — replace with actual job owner id
    rating:      STATE.currentRating,
    body:        document.getElementById('review-text').value
  });
  if (error){alert(error.message);return;}
  closeOverlay('rating-overlay');
}
function closeOverlay(id){document.getElementById(id).classList.remove('open');}

// ─── INIT ─────────────────────────────────────────────────────────────────────
(async()=>{
  const {data:{session}} = await sb.auth.getSession();
  if (session?.user) await onLogin(session.user);
})();
</script>
